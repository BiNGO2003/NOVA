{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Регистрация — NOVA</title><link rel="stylesheet" href="{% static 'styles.css' %}">
</head>
<body class="auth-page">
  <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
  <main class="auth-card">
    <a class="brand" href="/"><span class="brand-mark"><span></span></span><span>NOVA <small>ЛИЧНЫЙ ПЛАННЕР</small></span></a>
    <div class="auth-copy"><p class="eyebrow">НОВЫЙ АККАУНТ</p><h1>Создайте свой план</h1><p>После регистрации планнер будет доступен только вам.</p></div>
    <form method="post" class="auth-form">{% csrf_token %}
      {% for field in form %}
        <label for="{{ field.id_for_label }}">{% if field.name == 'username' %}Имя пользователя{% elif field.name == 'password1' %}Пароль{% else %}Повторите пароль{% endif %}</label>{{ field }}
        {% for error in field.errors %}<p class="field-error">{{ error }}</p>{% endfor %}
      {% endfor %}
      <button class="primary-button" type="submit">Зарегистрироваться</button>
    </form>
    <p class="auth-switch">Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a></p>
  </main>
</body>
</html>
